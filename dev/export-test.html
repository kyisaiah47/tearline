<!doctype html>
<html>
<head><meta charset="utf-8"><title>export test</title>
<style>
  body { background:#15171a; color:#e8e6e1; font:14px ui-monospace,Menlo,monospace; padding:24px; }
  #status { font-size:22px; margin:0 0 18px; }
  .ok { color:#6ee7a8; } .bad { color:#ff8080; }
  .row { display:flex; gap:40px; align-items:flex-start; }
  figure { margin:0; }
  figcaption { color:#9aa0a6; margin-bottom:10px; }
  img { border:1px dashed #3a4048; }
</style>
</head>
<body>
  <p id="status">running…</p>
  <div class="row">
    <figure>
      <figcaption>live element</figcaption>
      <tear-line id="r" barcode="047320260726" seed="20260726">
        <h1>Meridian</h1>
        <p><small>COFFEE &amp; PROVISIONS</small></p>
        <hr>
        <table>
          <tr><td>2</td><td>Filter — Kiamugumo</td><td align="right">9.00</td></tr>
          <tr><td>1</td><td>Cortado</td><td align="right">4.25</td></tr>
        </table>
        <hr>
        <table><tr><td><strong>TOTAL</strong></td><td align="right"><strong>13.25</strong></td></tr></table>
        <hr>
      </tear-line>
    </figure>
    <figure>
      <figcaption>exported PNG (round-tripped back into an img)</figcaption>
      <img id="out" alt="exported receipt">
    </figure>
  </div>

<script type="module" src="../src/tearline.js"></script>
<script type="module">
  const status = document.getElementById('status');
  try {
    await customElements.whenDefined('tear-line');
    await new Promise(r => requestAnimationFrame(r));
    const el = document.getElementById('r');
    const url = await el.toDataURL({ scale: 2 });
    if (!url.startsWith('data:image/png') || url.length < 5000) {
      throw new Error(`suspicious output: ${url.slice(0, 40)}… len=${url.length}`);
    }
    document.getElementById('out').src = url;
    status.className = 'ok';
    status.textContent = `PASS — PNG produced, ${Math.round(url.length / 1024)} KB of base64`;
  } catch (e) {
    status.className = 'bad';
    status.textContent = 'FAIL — ' + e.message;
    console.error(e);
  }
</script>
</body>
</html>
